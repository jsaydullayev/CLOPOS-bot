# Admin paneldagi «📢 Kanal shabloni». Matnda < va > o‘rniga &lt; va &gt; yozing.
channel_guide = """<b>📢 Kanalga video qo‘yish</b>

Videoni kanalga <b>video</b> qilib (fayl emas) va <b>bittadan</b> tashlang. Caption:
1-qator — bo‘lim, 2-qator — video nomi, 3-qatordan — tavsif (ixtiyoriy).
Namunani bossangiz, nusxalanadi.

<b>1. Mavjud bo‘limga — kod bilan (eng ishonchli)</b>
Kodni «📋 Bo‘lim kodlari»dan oling:
<code>#12
Hisobot olish
Kunlik savdo hisobotini ko‘rish</code>

<b>2. Mavjud bo‘limga — nom bilan</b>
Bo‘limlarni › yoki &gt; bilan ajrating:
<code>Videodarsliklar › Finans
Hisobot olish</code>

<b>3. Yangi bo‘limga</b>
Yangi bo‘lim nomi oldiga <b>+</b> qo‘ying:
<code>Videodarsliklar › +Ombor
Qoldiqni ko‘rish</code>
Kod bilan: <code>#12 › +Ombor</code>
Yangi asosiy bo‘lim: <code>+Kurslar › Boshlang‘ich</code>
+ qo‘yilgan bo‘lim va undan keyingilari topilmasa, yangi ochiladi.

<b>Bot nimalarni kechiradi</b>
• katta-kichik harf, ortiqcha bo‘sh joy, tinish belgilari
• o‘, o', oʻ — hammasi bir xil
• kirill va lotin o‘xshash harflari: а/a, о/o, с/c, р/p…
• 1–2 harf xatosi: «Finas» → «Finans». Bot nimani tuzatganini adminlarga yozadi.
Raqamlar aniq bo‘lishi kerak: «1-dars» va «2-dars» — boshqa-boshqa bo‘lim. 4 harfgacha bo‘lgan nomlar ham aniq yozilsin.

<b>Xatodan himoya</b>
• Oldida + yo‘q va topilmagan bo‘lim ochilmaydi: postga 👎 qo‘yiladi, adminlarga o‘xshash nomlar yuboriladi.
• Qo‘shilgan postga 👍 qo‘yiladi.
• Captionni tahrirlasangiz, video ham yangilanadi: nom, tavsif, bo‘lim.
• Ichida bo‘limlari bor bo‘limga video qo‘yilmaydi — ichidagi bo‘limni tanlang."""
