services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-videobot}
      POSTGRES_USER: ${POSTGRES_USER:-videobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylida berilishi kerak}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-videobot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-videobot}
    depends_on:
      db:
        condition: service_healthy

  # HTTPS for webhook mode only: Caddy gets a Let's Encrypt certificate for DOMAIN.
  # Started with `docker compose --profile webhook up -d`; polling mode does not need it.
  caddy:
    image: caddy:2-alpine
    profiles: ["webhook"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot

volumes:
  db_data:
  caddy_data:
  caddy_config:
